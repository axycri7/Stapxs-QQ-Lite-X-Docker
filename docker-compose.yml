services:
  stapxs-qq-lite-x:
    image: ghcr.io/axycri7/stapxs-qq-lite-x-docker:latest
    container_name: stapxs-qq-lite-x
    init: true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ssl-certs:/etc/ssl/certs
      - ssl-private:/etc/ssl/private
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SSL_VALIDITY_DAYS: ${SSL_VALIDITY_DAYS:-90}
      SSL_RENEWAL_THRESHOLD_DAYS: ${SSL_RENEWAL_THRESHOLD_DAYS:-7}
      SSL_CHECK_INTERVAL_HOURS: ${SSL_CHECK_INTERVAL_HOURS:-24}
      SSL_KEY_SIZE: ${SSL_KEY_SIZE:-4096}
      SSL_SUBJECT: ${SSL_SUBJECT:-/C=US/ST=State/L=City/O=Organization/CN=localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ssl-certs:
  ssl-private:
