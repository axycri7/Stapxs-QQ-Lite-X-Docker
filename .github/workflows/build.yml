name: build

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: .this
          fetch-depth: 1

      - name: Get last upstream SHA
        run: |
          if [ -f .this/.last_upstream_sha ]; then
            echo "LAST_SHA=$(cat .this/.last_upstream_sha)" >> $GITHUB_ENV
          fi

      - name: Get current upstream SHA
        run: |
          CURRENT_SHA=$(git ls-remote --heads https://github.com/Chzxxuanzheng/Stapxs-QQ-Lite-X.git test | head -1 | cut -f1)
          if [ -z "$CURRENT_SHA" ]; then
            echo "Error: Could not fetch upstream SHA" >&2
            exit 1
          fi
          echo "CURRENT_SHA=$CURRENT_SHA" >> $GITHUB_ENV

      - name: Check if upstream changed
        run: |
          if [ "$CURRENT_SHA" != "$LAST_SHA" ] || [ -z "$LAST_SHA" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD=true" >> $GITHUB_ENV
          else
            echo "BUILD=false" >> $GITHUB_ENV
            echo "Upstream has not changed since last build. Skipping build."
          fi

      - name: pull source
        if: env.BUILD == 'true'
        uses: actions/checkout@v4
        with:
          repository: Chzxxuanzheng/Stapxs-QQ-Lite-X
          ref: test 
          submodules: recursive
          fetch-depth: 0
          path: source
        
      - name: Set short sha
        if: env.BUILD == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        if: env.BUILD == 'true'
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Node.js
        if: env.BUILD == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: configure pnpm
        if: env.BUILD == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: enable Corepack and prepare pnpm
        if: env.BUILD == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v

      - name: install dependencies
        if: env.BUILD == 'true'
        run: |
          cd source
          pnpm install --frozen-lockfile

      - name: build vue app
        if: env.BUILD == 'true'
        run: |
          cd source
          pnpm build

      - name: configure docker buildx
        if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.BUILD == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: env.BUILD == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/axycri7/stapxs-qq-lite-x-docker
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: build and push container image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: source
          tags: |
            ghcr.io/axycri7/stapxs-qq-lite-x-docker:latest
            ghcr.io/axycri7/stapxs-qq-lite-x-docker:sha-${{ env.SHORT_SHA }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test SSL certificate renewal
        if: env.BUILD == 'true'
        run: |
          cd .this
          docker pull ghcr.io/axycri7/stapxs-qq-lite-x-docker:latest
          docker compose up -d
          sleep 10
          bash ./test-ssl-renewal.sh stapxs-qq-lite-x
          docker compose down

      - name: Update last upstream SHA
        if: env.BUILD == 'true'
        run: |
          mkdir -p .this
          echo $CURRENT_SHA > .this/.last_upstream_sha
          cd .this
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_upstream_sha
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update last upstream SHA to $CURRENT_SHA"
            git push
          fi

      - name: logout registry
        if: always()
        run: docker logout ghcr.io