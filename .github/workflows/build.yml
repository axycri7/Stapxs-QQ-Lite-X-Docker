name: build

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: .this

      - name: Get last upstream SHA
        run: |
          if [ -f .this/.last_upstream_sha ]; then
            echo "LAST_SHA=$(cat .this/.last_upstream_sha)" >> $GITHUB_ENV
          fi

      - name: Get current upstream SHA
        run: |
          CURRENT_SHA=$(git ls-remote https://github.com/Chzxxuanzheng/Stapxs-QQ-Lite-X.git test | head -1 | cut -f1)
          echo "CURRENT_SHA=$CURRENT_SHA" >> $GITHUB_ENV

      - name: Check if upstream changed
        run: |
          if [ "$CURRENT_SHA" != "$LAST_SHA" ] || [ -z "$LAST_SHA" ]; then
            echo "BUILD=true" >> $GITHUB_ENV
          else
            echo "BUILD=false" >> $GITHUB_ENV
            echo "Upstream has not changed since last build. Skipping build."
          fi

      - name: pull source
        if: env.BUILD == 'true'
        uses: actions/checkout@v4
        with:
          repository: Chzxxuanzheng/Stapxs-QQ-Lite-X
          ref: test 
          submodules: recursive
          fetch-depth: 0
        
      - name: Set short sha
        if: env.BUILD == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        if: env.BUILD == 'true'
        uses: docker/setup-qemu-action@v3
        
      - name: configure pnpm
        if: env.BUILD == 'true'
        uses: pnpm/action-setup@v4

      - name: enable Corepack and prepare pnpm
        if: env.BUILD == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v

      - name: install dependencies
        if: env.BUILD == 'true'
        run: |
          pnpm install --frozen-lockfile

      - name: build vue app
        if: env.BUILD == 'true'
        run: pnpm build

      - name: configure docker buildx
        if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: login registry
        if: env.BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push container image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ghcr.io/axycri7/stapxs-qq-lite-x-docker:latest
            ghcr.io/axycri7/stapxs-qq-lite-x-docker:sha-${{ env.SHORT_SHA }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update last upstream SHA
        if: env.BUILD == 'true'
        run: |
          echo $CURRENT_SHA > .this/.last_upstream_sha
          cd .this
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_upstream_sha
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update last upstream SHA to $CURRENT_SHA"
            git push
          fi

      - name: logout registry
        if: always()
        run: docker logout ghcr.io