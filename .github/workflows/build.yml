name: build

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force rebuild even if upstream is unchanged
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Chzxxuanzheng/Stapxs-QQ-Lite-X
  UPSTREAM_REF: test
  IMAGE: ghcr.io/axycri7/stapxs-qq-lite-x-docker

jobs:
  check-upstream:
    name: Check upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      upstream_short_sha: ${{ steps.upstream.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve upstream SHA
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_REF}" | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::Could not fetch upstream SHA for ${UPSTREAM_REPO}@${UPSTREAM_REF}"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          last_sha=""
          [ -f .last_upstream_sha ] && last_sha=$(tr -d '[:space:]' < .last_upstream_sha)
          if [ "${FORCE_REBUILD:-false}" = "true" ] || [ "$last_sha" != "$UPSTREAM_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Upstream $UPSTREAM_SHA differs from last ($last_sha); building."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Upstream unchanged at $last_sha; skipping build."
          fi

  build:
    name: Build and push image
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ needs.check-upstream.outputs.upstream_short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.check-upstream.outputs.upstream_sha }}
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_REPO=https://github.com/${{ env.UPSTREAM_REPO }}.git
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
            UPSTREAM_SHA=${{ needs.check-upstream.outputs.upstream_sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  update-sha:
    name: Record upstream SHA
    needs: [check-upstream, build]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Commit new upstream SHA
        env:
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
          UPSTREAM_SHORT_SHA: ${{ needs.check-upstream.outputs.upstream_short_sha }}
        run: |
          set -euo pipefail
          echo "$UPSTREAM_SHA" > .last_upstream_sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_upstream_sha
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update upstream SHA to $UPSTREAM_SHORT_SHA"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push updated .last_upstream_sha after 3 attempts"
          exit 1
